<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tot de bodem · podcast over wijn en wetenschap</title>
  <meta name="description" content="Tot de bodem: een podcast over wijn en wetenschap. Luister alle afleveringen, met shownotes en bronnen.">
  <meta property="og:title" content="Tot de bodem">
  <meta property="og:description" content="Een podcast over wijn en wetenschap.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" id="skip" href="#main">Naar de inhoud</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="#/" aria-label="Tot de bodem, home">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="var(--zand)"/>
          <clipPath id="lc"><circle cx="16" cy="16" r="15"/></clipPath>
          <g clip-path="url(#lc)">
            <path d="M0 15 Q8 12 16 15 T32 14 V32 H0Z" fill="var(--mos)"/>
            <path d="M0 20 Q8 18 16 21 T32 20 V32 H0Z" fill="var(--klei)"/>
            <path d="M0 25 Q8 23 16 26 T32 25 V32 H0Z" fill="var(--aarde)"/>
          </g>
        </svg>
        <span>Tot de bodem</span>
      </a>
      <nav class="nav" aria-label="Hoofdmenu">
        <div class="menu" id="menu">
          <button type="button" class="menu-knop" id="menuKnop" aria-expanded="false" aria-controls="menuPaneel" data-nav="hoofdstuk">
            Hoofdstukken
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="menu-paneel" id="menuPaneel"></div>
        </div>
        <a href="#/over" data-nav="over">Over ons</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong>Tot de bodem</strong> · een podcast over wijn en wetenschap</p>
      <p class="muted" id="voettekst">Gemaakt met behulp van AI · Geniet met mate.</p>
    </div>
  </footer>

  <div class="player" id="player" role="region" aria-label="Audiospeler" hidden>
    <div class="wrap player-inner">
      <button class="p-toggle" id="pToggle" type="button" aria-label="Afspelen"></button>
      <div class="p-info">
        <div class="p-head">
          <a class="p-title" id="pTitle" href="#/"></a>
          <span class="p-serie" id="pSerie"></span>
        </div>
        <div class="p-seek">
          <span id="pCur">0:00</span>
          <input type="range" id="pSeek" min="0" max="1000" value="0" step="1" aria-label="Positie in aflevering">
          <span id="pDur">0:00</span>
        </div>
        <p class="p-error" id="pError" hidden></p>
      </div>
      <div class="p-extra">
        <button type="button" id="pBack" aria-label="15 seconden terug">−15</button>
        <button type="button" id="pFwd" aria-label="30 seconden vooruit">+30</button>
        <button type="button" id="pRate" class="p-rate" aria-label="Afspeelsnelheid">1×</button>
      </div>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>

  <script src="app.js"></script>
</body>
</html>
